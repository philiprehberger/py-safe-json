[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "philiprehberger-safe-json"
version = "0.1.0"
description = "JSON encoder that handles datetime, Decimal, UUID, dataclasses, and sets without crashing"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Philip Rehberger" }]
keywords = ["json", "encoder", "datetime", "decimal", "uuid", "serialization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/philiprehberger/py-safe-json"
Repository = "https://github.com/philiprehberger/py-safe-json"
Issues = "https://github.com/philiprehberger/py-safe-json/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/philiprehberger_safe_json"]
